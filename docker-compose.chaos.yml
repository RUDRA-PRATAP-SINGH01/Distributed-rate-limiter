# Minimal stack for CI resilience contracts (L-01).
# Usage:
#   docker compose -f docker-compose.chaos.yml -p rate-chaos up -d --build
#   go test -tags=chaos ./chaos/...
#
# Intentionally excludes Grafana/Jaeger/Prometheus/gateways so PR chaos stays fast.

services:
  redis:
    image: redis:7-alpine
    container_name: rate-chaos-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - chaos-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  limiter:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.limiter
    container_name: rate-chaos-limiter
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
      - OTEL_ENABLED=false
      - ALGORITHM=token
      - CAPACITY=10
      - REFILL_RATE=1.0
      - WINDOW_SEC=60
      - ENABLE_HIERARCHICAL=true
      - GLOBAL_CAPACITY=1000000
      - GLOBAL_REFILL_RATE=10000.0
      - TENANT_CAPACITY=100000
      - TENANT_REFILL_RATE=1000.0
      - USER_CAPACITY=100
      - USER_REFILL_RATE=1.0
      - ENDPOINT_CAPACITY=10
      - ENDPOINT_REFILL_RATE=0.5
      - ENABLE_ADMIN_API=true
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=8082
      - ADMIN_API_KEY=dev-key-change-in-prod
      - INTERNAL_API_KEY=dev-internal-key-change-in-prod
      - ALLOW_QUERY_USER_ID=false
      - ENABLE_AUDIT_TRAIL=false
      - CB_CONSECUTIVE_FAILURES=2
      - CB_MIN_SAMPLES=2
      - CB_OPEN_COOLDOWN_MS=2000
      - CB_HALF_OPEN_MAX_PROBES=3
      - CB_HALF_OPEN_SUCCESS_REQUIRED=1
    ports:
      - "8080:8080"
      - "8082:8082"
    networks:
      - chaos-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  demo:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.demo
    container_name: rate-chaos-demo
    environment:
      - PORT=8081
    networks:
      - chaos-net

  sidecar:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.sidecar
    container_name: rate-chaos-sidecar
    environment:
      - PORT=9090
      - UPSTREAM_URL=http://demo:8081
      - RATE_LIMITER_URL=http://limiter:8080
      - ENABLE_ROUTING=false
      - ENABLE_IDEMPOTENCY=false
      - RATE_LIMIT=10
      - USE_HIERARCHICAL=false
      - FAIL_OPEN=false
      - INTERNAL_API_KEY=dev-internal-key-change-in-prod
      - ALLOW_QUERY_USER_ID=false
      - ALLOWED_PATHS=/
      - OTEL_ENABLED=false
    ports:
      - "9090:9090"
    networks:
      - chaos-net
    depends_on:
      redis:
        condition: service_healthy
      limiter:
        condition: service_healthy
      demo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

networks:
  chaos-net:
    driver: bridge
