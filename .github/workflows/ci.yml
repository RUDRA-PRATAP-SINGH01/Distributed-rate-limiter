name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Go Modules
        run: go mod verify

      - name: Vet Code
        run: go vet ./...

      - name: Build Binaries
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit Tests
        run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests with Race Detector
        run: go test -count=1 -race ./...

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Redis Connection and Run Integration Tests
        env:
          REDIS_TEST_ADDR: 127.0.0.1:6379
        run: |
          echo "PROVING REAL REDIS MODE: REDIS_TEST_ADDR is set to $REDIS_TEST_ADDR"
          # Run integration tests in internal/limiter package
          go test -count=1 -v ./internal/limiter/...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Coverage Profile
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Print Coverage Summary
        run: go tool cover -func=coverage.out

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  # L-01: CI-gated resilience contracts (R1 fail-closed). Authoritative
  # "chaos-tested" proof — uses production headers, not ?user_id=.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resilience contracts (R1 Redis down → fail-closed)
        env:
          INTERNAL_API_KEY: dev-internal-key-change-in-prod
          CHAOS_LIMITER_URL: http://127.0.0.1:8080
          CHAOS_SIDECAR_URL: http://127.0.0.1:9090
        run: go test -count=1 -tags=chaos -timeout 25m -v ./chaos/...
