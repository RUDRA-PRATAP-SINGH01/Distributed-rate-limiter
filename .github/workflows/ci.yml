name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job resolves Go from go.mod. The `toolchain` directive there pins a
  # patched release, which is what keeps the vuln job green — see M-07.
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Go Modules
        run: go mod verify

      - name: Vet Code
        run: go vet ./...

      - name: Build Binaries
        run: go build ./...

  # M-07: static analysis beyond `go vet`. Config and rationale for every
  # enabled/excluded linter live in .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  # M-07: fails the build on any known CVE reachable from our call graph,
  # covering both the standard library and third-party modules.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan for known vulnerabilities
        run: govulncheck ./...

  # Fast smoke of the critical HTTP path (httptest + miniredis). Live compose
  # smoke/sanity stay local: scripts/qa.ps1 smoke|sanity. See docs/testing/.
  process-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Process smoke (health + check + sidecar health)
        run: |
          go test -count=1 -timeout 60s ./cmd/limiter/ \
            -run 'TestHealthEndpoint_Healthy$|TestCheckHandler_TokenBucket$'
          go test -count=1 -timeout 60s ./cmd/sidecar/ \
            -run 'TestSidecarHealth_LimiterAndRedisHealthy$'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit Tests
        run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests with Race Detector
        run: go test -count=1 -race ./...

  # M-07: every package that executes Lua against Redis runs a second time on a
  # real server. miniredis runs Lua on gopher-lua with its own clock, so a
  # script can pass in-memory and still break in production.
  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Integration Tests Against Real Redis
        env:
          REDIS_TEST_ADDR: 127.0.0.1:6379
        # -p 1 because the suites share one database and each harness flushes it
        # on setup. A handful of tests that need to kill the server mid-run skip
        # here with a logged reason; they still run in the miniredis pass above.
        run: |
          echo "REAL REDIS MODE: REDIS_TEST_ADDR=$REDIS_TEST_ADDR"
          go test -count=1 -p 1 -v \
            ./internal/limiter/... \
            ./internal/circuitbreaker/... \
            ./internal/idempotency/... \
            ./internal/audit/... \
            ./internal/routing/...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Coverage Profile
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Print Coverage Summary
        run: go tool cover -func=coverage.out

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  # L-01: CI-gated resilience contracts (R1 fail-closed). Authoritative
  # "chaos-tested" proof — uses production headers, not ?user_id=.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resilience contracts (R1 Redis down → fail-closed)
        env:
          INTERNAL_API_KEY: dev-internal-key-change-in-prod
          CHAOS_LIMITER_URL: http://127.0.0.1:8080
          CHAOS_SIDECAR_URL: http://127.0.0.1:9090
        run: go test -count=1 -tags=chaos -timeout 25m -v ./chaos/...
