global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'rate-limiter'
    static_configs:
      - targets: ['limiter:8080']
  - job_name: 'sidecar'
    static_configs:
      - targets: ['sidecar:9090']
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
