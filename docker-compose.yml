services:
  redis:
    image: redis:7-alpine
    container_name: rate-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - rate-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  limiter:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.limiter
    container_name: rate-limiter
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=rate-limiter
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - ALGORITHM=sliding
      - CAPACITY=10
      - REFILL_RATE=1.0
      - WINDOW_SEC=60
      - ENABLE_HIERARCHICAL=true
      - GLOBAL_CAPACITY=1000000
      - GLOBAL_REFILL_RATE=10000.0
      - TENANT_CAPACITY=100000
      - TENANT_REFILL_RATE=1000.0
      - USER_CAPACITY=100
      - USER_REFILL_RATE=1.0
      - ENDPOINT_CAPACITY=10
      - ENDPOINT_REFILL_RATE=0.5
      - ENABLE_ADMIN_API=true
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=8082
      - ADMIN_API_KEY=dev-key-change-in-prod
      - INTERNAL_API_KEY=dev-internal-key-change-in-prod
      - ALLOW_QUERY_USER_ID=false
      - OVERRIDE_CACHE_TTL_MS=5000
      - ENABLE_AUDIT_TRAIL=true
      - AUDIT_RETENTION_HOURS=168
      - AUDIT_MAX_EVENTS=100000
    ports:
      - "8080:8080"
      - "8082:8082"
    networks:
      - rate-net
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  demo:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.demo
    container_name: demo-backend
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    networks:
      - rate-net

  gateway-a:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.gateway
    container_name: gateway-a
    environment:
      - PORT=8081
      - GATEWAY_ID=gateway-a
      - SIMULATED_LATENCY_MS=15
      - SIMULATED_ERROR_RATE=0.01
    networks:
      - rate-net

  gateway-b:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.gateway
    container_name: gateway-b
    environment:
      - PORT=8081
      - GATEWAY_ID=gateway-b
      - SIMULATED_LATENCY_MS=50
      - SIMULATED_ERROR_RATE=0.05
    networks:
      - rate-net

  gateway-c:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.gateway
    container_name: gateway-c
    environment:
      - PORT=8081
      - GATEWAY_ID=gateway-c
      - SIMULATED_LATENCY_MS=120
      - SIMULATED_ERROR_RATE=0.35
    networks:
      - rate-net

  sidecar:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.sidecar
    container_name: rate-sidecar
    environment:
      - PORT=9090
      - UPSTREAM_URL=http://demo:8081
      - RATE_LIMITER_URL=http://limiter:8080
      - ENABLE_ROUTING=true
      - GATEWAYS=gateway-a|http://gateway-a:8081|100,gateway-b|http://gateway-b:8081|80,gateway-c|http://gateway-c:8081|60
      - ROUTING_ALLOW_PRIVATE=true
      - ROUTING_TARGET_LATENCY_MS=100
      - ROUTING_CIRCUIT_ERROR_RATE=0.5
      - ROUTING_CIRCUIT_MIN_SAMPLES=10
      - ROUTING_PROBE_INTERVAL_SEC=15
      - RATE_LIMIT=10
      - USE_HIERARCHICAL=false
      - FAIL_OPEN=false
      - INTERNAL_API_KEY=dev-internal-key-change-in-prod
      - ALLOW_QUERY_USER_ID=false
      - ALLOWED_PATHS=/
      - DEBUG=false
      - ENABLE_IDEMPOTENCY=true
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
      - IDEMPOTENCY_LOCK_TTL_MS=60000
      - IDEMPOTENCY_COMPLETED_TTL_MS=86400000
      - IDEMPOTENCY_FAIL_OPEN=false
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=rate-sidecar
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
      - "9090:9090"
    networks:
      - rate-net
    depends_on:
      redis:
        condition: service_healthy
      limiter:
        condition: service_healthy
      gateway-a:
        condition: service_started
      gateway-b:
        condition: service_started
      gateway-c:
        condition: service_started
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP
    networks:
      - rate-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "9121:9121"
    networks:
      - rate-net
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rate-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      limiter:
        condition: service_healthy
      sidecar:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - rate-net
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  rate-net:
    driver: bridge

volumes:
  grafana-data:
