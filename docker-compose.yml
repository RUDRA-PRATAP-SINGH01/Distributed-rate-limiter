services:
  redis:
    image: redis:7-alpine
    container_name: rate-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - rate-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  limiter:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.limiter
    container_name: rate-limiter
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
      - ALGORITHM=sliding
      - CAPACITY=10
      - REFILL_RATE=1.0
      - WINDOW_SEC=60
      - ENABLE_HIERARCHICAL=true
      - GLOBAL_CAPACITY=1000000
      - GLOBAL_REFILL_RATE=10000.0
      - TENANT_CAPACITY=100000
      - TENANT_REFILL_RATE=1000.0
      - USER_CAPACITY=100
      - USER_REFILL_RATE=1.0
      - ENDPOINT_CAPACITY=10
      - ENDPOINT_REFILL_RATE=0.5
      - ENABLE_ADMIN_API=true
      - ADMIN_PORT=8082
      - ADMIN_API_KEY=dev-key-change-in-prod
      - INTERNAL_API_KEY=dev-internal-key-change-in-prod
      - ALLOW_QUERY_USER_ID=true
      - OVERRIDE_CACHE_TTL_MS=5000
    ports:
      - "8080:8080"
      - "8082:8082"
    networks:
      - rate-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  demo:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.demo
    container_name: demo-backend
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    networks:
      - rate-net

  sidecar:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.sidecar
    container_name: rate-sidecar
    environment:
      - PORT=9090
      - UPSTREAM_URL=http://demo:8081
      - RATE_LIMITER_URL=http://limiter:8080
      - RATE_LIMIT=10
      - USE_HIERARCHICAL=false
      - FAIL_OPEN=false
      - INTERNAL_API_KEY=dev-internal-key-change-in-prod
      - ALLOW_QUERY_USER_ID=true
      - ALLOWED_PATHS=/
      - DEBUG=false
      - ENABLE_IDEMPOTENCY=true
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
      - IDEMPOTENCY_LOCK_TTL_MS=60000
      - IDEMPOTENCY_COMPLETED_TTL_MS=86400000
      - IDEMPOTENCY_FAIL_OPEN=false
    ports:
      - "9090:9090"
    networks:
      - rate-net
    depends_on:
      redis:
        condition: service_healthy
      limiter:
        condition: service_healthy
      demo:
        condition: service_started

